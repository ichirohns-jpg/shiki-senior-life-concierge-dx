<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b6fa4">
  <title>回覧板・地域情報</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#f5fbfe;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
    .bar{height:56px;display:flex;align-items:center;gap:12px;padding:8px 14px;background:#fff;border-bottom:1px solid #d7e5ec;position:relative;z-index:2}
    .bar a{color:#075d91;font-weight:700;text-decoration:underline;white-space:nowrap}
    .bar strong{color:#123b53;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    iframe{display:block;width:100%;height:calc(100vh - 56px);height:calc(100dvh - 56px);border:0;background:#fff}
  </style>
</head>
<body>
  <div class="bar">
    <a href="./">← 戻る</a>
    <strong>回覧板・地域情報</strong>
  </div>
  <iframe id="board" title="志木お助け隊 回覧板" src="https://ichirohns-jpg.github.io/ShikiConcierge-18/app.html"></iframe>
  <script>
    const frame=document.getElementById('board');
    function removeOldTopLink(){
      try{
        const doc=frame.contentDocument;
        if(!doc)return;
        doc.querySelectorAll('a').forEach(a=>{
          if((a.getAttribute('href')||'')==='index.html')a.remove();
        });
      }catch(e){}
    }
    frame.addEventListener('load',()=>{
      removeOldTopLink();
      setTimeout(removeOldTopLink,500);
      setTimeout(removeOldTopLink,1500);
    });
  </script>
</body>
</html>
