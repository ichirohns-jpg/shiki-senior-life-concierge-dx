  function imgUrl(url){
    const u=safeUrl(url);
    const m=u.match(/drive\.google\.com\/.*?[?&]id=([A-Za-z0-9_-]+)/i);
    return m ? `https://drive.google.com/thumbnail?id=${m[1]}&sz=w1200` : u;
  }

  function jsonp(params={}){
    return new Promise((resolve,reject)=>{
      const cb = '__shikiSenior_' + Date.now() + '_' + Math.random().toString(36).slice(2);
      const script = document.createElement('script');
      const q = new URLSearchParams({callback:cb, ...params});
      let finished=false;
      const clean=()=>{finished=true;clearTimeout(timer);script.remove();try{delete window[cb]}catch(e){window[cb]=undefined}};
      // 60秒待たせず、15秒で画面にエラーを表示する。
      // スマホで「読み込み中」のまま固まって見えるのを防ぐ。
      const timer=setTimeout(()=>{if(finished)return;clean();reject(new Error('通信がタイムアウトしました。GASの公開設定または通信を確認してください。'))},15000);
      window[cb]=(payload)=>{if(finished)return;clean();if(payload && payload.ok===false) reject(new Error(payload.message||'データを取得できませんでした'));else resolve(payload)};
      script.onerror=()=>{if(finished)return;clean();reject(new Error('通信に失敗しました'))};
      script.src=GAS_URL+'?'+q.toString();
      document.head.appendChild(script);
    });
  }
  async function api(mode, params={}){ return jsonp({mode,...params}); }

  function imageCard(im){

    const titles={

    return `<article class="card image-card"><button data-action="image" data-number="${esc(im.number)}">${image}<div class="card-body"><h3>${esc(title)}</h3><p class="card-hint">タップして相談する</p></div></button></article>`;

  function normalizeSearch(value){
    return text(value).toLocaleLowerCase().replace(/[ 　・、。,.／/\\]/g,'').replace(/ゴミ/g,'ごみ');
  }
  function reverseLookup(value){
    const query=normalizeSearch(value);if(!query)return [];
    const matches=[];
    REVERSE_LOOKUP.forEach(item=>{
      let score=0;
      item.keywords.forEach(keyword=>{
        const key=normalizeSearch(keyword);
        if(!key)return;
        if(query===key)score=Math.max(score,100+key.length);
        else if(query.includes(key))score=Math.max(score,30+key.length*2);
        else if(key.includes(query)&&query.length>=2)score=Math.max(score,18+query.length*2);
      });
      if(score>0)matches.push({kind:'theme',score,themeId:item.themeId,title:item.label,description:item.description});
    });
    QUICK_SERVICES.forEach(service=>{
      const haystack=normalizeSearch(service.title+' '+service.description);
      let score=0;
      if(query===normalizeSearch(service.title))score=120;
      else if(haystack.includes(query)&&query.length>=2)score=70;
      else if(query.includes(normalizeSearch(service.title).slice(0,4)))score=45;
      if(score>0)matches.push({kind:'service',score,service});
    });
    return matches.sort((a,b)=>b.score-a.score).slice(0,6);
  }

  function startVoiceInput(targetId){
    const input=document.getElementById(targetId);
    const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!input)return;
    if(!SpeechRecognition){alert('このブラウザでは音声入力に対応していません。文字で入力してください。');return}
    const recognition=new SpeechRecognition();
    recognition.lang='ja-JP';recognition.interimResults=false;recognition.maxAlternatives=1;
    recognition.onresult=(event)=>{
      const value=text(event.results?.[0]?.[0]?.transcript);
      if(value){input.value=value;if(targetId==='reverseSearch')state.reverseQuery=value;}
    };
    recognition.onerror=()=>alert('音声を認識できませんでした。もう一度お試しください。');
    try{recognition.start()}catch(ignore){alert('音声入力を開始できませんでした。文字で入力してください。')}
  }

    const inputSummary=state.freeText?`<div class="notice"><strong>入力内容</strong><br>${esc(state.freeText)}</div>`:'';
    return shell('相談を整理しています',`${inputSummary}<p class="crumb">${esc(state.currentTheme?.name||'相談')}　質問 ${state.stack.length}</p><section class="question-box"><div class="question-count">一つずつ選んでください</div><h2>${esc(q.text)}</h2>${q.help?`<p class="small">${esc(q.help)}</p>`:''}<div class="choices">${options}</div></section><div class="actions"><button class="btn btn-light" data-action="question-back">前の質問</button><button class="btn btn-light" data-action="free">文章で相談</button></div>`,true);
  }
  function freeView(){
    return shell('文章で相談する',`<p>困っていることを、短い文章で入力してください。</p><label class="field-label" for="freeText">相談内容</label><div class="input-tools"><textarea id="freeText" placeholder="例：施設に入るので、家をどうしたらよいか分からない">${esc(state.freeText)}</textarea><button class="btn btn-light voice-btn" data-action="voice-input" data-target="freeText">🎙 音声で入力する</button></div><div class="actions"><button class="btn btn-primary large-action" data-action="send-free">相談先を探す</button><button class="btn btn-light large-action" data-action="concierge">テーマから選ぶ</button></div><p class="small">送信内容は相談先を探すために使います。緊急情報は入力せず、直接119番などへ連絡してください。</p>`,true);
  }
  function resultView(result){
    const d=dataOf(result);const matched=first(d.matchedTheme?.name,d.theme?.name,d.themeName,state.currentTheme?.name,'相談結果');
    const reason=first(d.reason,d.message,d.explanation,d.understanding,'選択内容に近い相談先を案内します。');
    // 最終結果では、返ってきた相談先だけを使う。
    // state.contacts（ホームの全相談先）へ戻すと、無関係なリンクまで表示される。
    const responseContacts=arrFrom(d,['contacts','results']);
    const resultContactIds=[d.contactId].concat(Array.isArray(d.contactIds)?d.contactIds:[])
      .map(x=>text(x)).filter(Boolean);
    // サーバーが返した相談先だけを使う。IDがある場合だけ、読み込み済み一覧から補完する。
    let contacts=responseContacts;
    if(!contacts.length && resultContactIds.length){
      contacts=state.contacts.filter(c=>resultContactIds.includes(text(first(c.contactId,c.id,''))));
    }
    contacts=contacts.filter(c=>{
      const phone=cleanContactValue(first(c.phone,c.tel,''));
      const url=safeUrl(first(c.officialUrl,c.url));
      // 「要登録」＋市トップだけの仮データは、相談先として表示しない。
      return !(isPlaceholder(first(c.phone,c.tel,'')) && (!url || url===GENERIC_CITY_URL));
    });
    const seenContactIds=new Set();
    contacts=contacts.filter(c=>{
      const id=text(first(c.contactId,c.id,''));
      if(id&&seenContactIds.has(id))return false;
      if(id)seenContactIds.add(id);
      return true;
    }).slice(0,1);
    const list=contacts.map(c=>{const cc={...c,name:first(c.name,c.title,'相談窓口'),role:first(c.role,c.description,''),phone:cleanContactValue(first(c.phone,c.tel,'')),hours:cleanContactValue(first(c.hours,'')),address:cleanContactValue(first(c.address,'')),officialUrl:safeUrl(first(c.officialUrl,c.url)),note:cleanContactValue(first(c.note,''))};return `<div class="contact"><h3>${esc(cc.name)}</h3>${cc.role?`<p>${esc(cc.role)}</p>`:''}${cc.phone?`<div class="phone"><a href="${esc(/^\d/.test(cc.phone)?'tel:'+cc.phone.replace(/[^\d+]/g,''):safeUrl(cc.phone))}">${esc(cc.phone)}</a></div>`:''}${cc.hours?`<p class="small">受付：${esc(cc.hours)}</p>`:''}${cc.address?`<p class="small">場所：${esc(cc.address)}</p>`:''}${cc.officialUrl?`<p><a href="${esc(cc.officialUrl)}" target="_blank" rel="noopener">公式情報を確認する</a></p>`:''}${cc.note?`<p class="small">${esc(cc.note)}</p>`:''}</div>`}).join('');
    const fallbackContact=/(詐欺|悪質商法|不審な請求|だまされた|騙された)/u.test(text(state.freeText)+' '+text(matched)+' '+text(reason))?CONSUMER_CONTACT:HUB_CONTACT;
    const fallback=contacts.length?'':`<div class="contact"><h3>${esc(fallbackContact.name)}</h3><p>${esc(fallbackContact.role)}</p><p class="phone"><a href="tel:${esc(fallbackContact.phone.replace(/[^\d+]/g,''))}">${esc(fallbackContact.phone)}</a></p><p class="small">${esc(fallbackContact.address)}</p><p><a href="${esc(fallbackContact.officialUrl)}" target="_blank" rel="noopener">公式情報を確認する</a></p><p class="small">${esc(fallbackContact.note)}</p></div>`;
    return shell('相談先の案内',`<section class="result"><h2>${esc(matched)}</h2><p class="lead">${esc(reason)}</p>${d.understanding?`<p>${esc(d.understanding)}</p>`:''}${list||fallback}</section><div class="actions"><button class="btn btn-primary" data-action="concierge">別の相談をする</button><button class="btn btn-light" data-action="home">ホームへ戻る</button></div><div class="notice">制度・電話番号・受付時間は変更されることがあります。電話前に公式情報をご確認ください。</div>`,true);
  }

  function boardView(){
    const list=state.articles.length?state.articles.map(a=>`<article class="article">${a.date?`<div class="date">${esc(a.date)}</div>`:''}<h3>${esc(a.title)}</h3>${a.image?`<img src="${esc(a.image)}" alt="" loading="lazy">`:''}${a.body?`<p>${esc(a.body).replace(/\n/g,'<br>')}</p>`:''}<div class="article-actions">${a.applyUrl?`<a class="btn btn-blue btn-small" href="${esc(a.applyUrl)}">申込・詳細</a>`:''}${a.officialUrl?`<a class="btn btn-light btn-small" href="${esc(a.officialUrl)}">公式ページ</a>`:''}</div></article>`).join(''):'<div class="empty">現在公開されている回覧板情報はありません。</div>';
    return shell('回覧板・地域情報',`<p class="crumb">高齢者や家族に役立つ地域のお知らせです。</p><div class="article-actions"><a class="btn btn-light" href="https://ichirohns-jpg.github.io/shiki-senior-life-concierge-dx/">ホームへ戻る</a><a class="btn btn-blue" href="${BOARD_URL}" target="_blank" rel="noopener">回覧板を開く</a></div>${list}`,true);
  }

  function render(){
    navActive();
    const app=$('#app');
    if(state.mode==='home')app.innerHTML=homeView();
    else if(state.mode==='themes')app.innerHTML=themesView();
    else if(state.mode==='concierge')app.innerHTML=conciergeView();
    else if(state.mode==='question')app.innerHTML=questionView();
    else if(state.mode==='free')app.innerHTML=freeView();
    else if(state.mode==='result')app.innerHTML=resultView(state.lastResult||{});
    else if(state.mode==='board')app.innerHTML=boardView();
    else app.innerHTML=homeView();
  }

  async function begin(){
    // 通信を待たず、まず操作できるホームを表示する。
    state.home={data:{description:'高齢者と家族が、困りごとを一つずつ整理して、相談先までたどり着くための案内です。',themes:LOCAL_THEME_CATALOG,images:[],contacts:[],articles:[]}};
    normalizeThemes();state.loading=false;render();
    loadHome(true);
  }
  async function answer(optionValue){
    const q=state.currentQuestion||findQuestion(state.stack[state.stack.length-1]);if(!q)return;
    const o=q.options.find(x=>String(first(x.value,x.id,x.label))===String(optionValue))||q.options.find(x=>String(x.id)===String(optionValue));if(!o)return;
    // シートに質問がないテーマは、このページ内の予備ルートで必ず終点まで進める。
    if(o.localResult){state.lastResult=o.localResult;state.mode='result';render();return}
    try{
      const r=await api('concierge',{themeId:state.currentTheme?.themeId,questionId:q.questionId,answer:first(o.value,o.label,o.id)});
      const d=dataOf(r);
      // GASが最終結果を返したら、必ず相談先画面へ進める。
      const isFinal=d.type==='result' || !!d.resultId || !!d.emergencyNotice;
      if(!isFinal && applyQuestionResponse(r)){state.mode='question';render();return}
      state.lastResult=r;state.mode='result';render();
    }catch(e){state.lastResult={data:{matchedTheme:{name:state.currentTheme?.name},reason:'通信に失敗しました。もう一度お試しください。',contacts:state.contacts}};state.mode='result';render()}
  }
  async function getServerResult(params){
    try{const r=await api('concierge',params);state.lastResult=r;state.mode='result';render()}
    catch(e){state.lastResult={data:{matchedTheme:{name:state.currentTheme?.name},reason:'選択内容を整理しました。下の相談先を確認してください。',contacts:state.contacts}};state.mode='result';render()}
  }

  // 生活に直結する明確な入力は、テーマ名の単語一致に任せない。
  // 「お金」という単語だけを拾って詐欺相談へ送る誤案内を防ぐ。
  function localSafetyRoute(input){
    const s=text(input);
    const hasLifeHardship=/(生活保護|お金がない|生活できない|生活ができない|生活費がない|家賃が払えない|食べるものがない|暮らせない)/u.test(s);
    const hasWorkHealth=/(病気で(働け|仕事ができ)|働けない|仕事ができない|収入がない|収入が減った|失業)/u.test(s);
    const hasScam=/(詐欺|悪質商法|不審な請求|だまされた|騙された)/u.test(s);
    if(hasScam){
      return {data:{type:'result',resultId:'LOCAL-CONSUMER',matchedTheme:{name:'詐欺・悪質商法'},reason:'詐欺や不審な請求の相談先を案内します。',understanding:'契約や支払いの状況を整理して、消費生活センターへ相談してください。',contacts:[CONSUMER_CONTACT]}};
    }
    if(hasLifeHardship && !hasScam && (hasWorkHealth || /生活保護|生活できない|生活ができない|生活費がない|家賃が払えない|食べるものがない|暮らせない/u.test(s))){
      return {data:{type:'result',resultId:'LOCAL-LIFE-SUPPORT',matchedTheme:{name:'生活保護・生活困窮'},reason:'生活費に困り、病気などで働けない場合の相談先を案内します。',understanding:'まず志木市役所の生活援護課へ相談してください。生活保護の申請や、生活に困っている場合の相談を受け付けています。',contacts:[{contactId:'LOCAL-LIFE-SUPPORT',name:'志木市役所 生活援護課生活援護グループ',role:'生活保護の相談・申請',phone:'048-473-1457',hours:'志木市公式情報で確認',address:'志木市役所',officialUrl:'https://www.city.shiki.lg.jp/soshiki/19/2688.html',note:'病気で働けない、生活費・家賃・食事に困っていることをそのまま伝えてください。'}]}};
    }
    return null;
  }

  async function sendFree(){
    const input=text($('#freeText')?.value);if(!input){alert('相談内容を入力してください。');return}
    state.freeText=input;
    const safeRoute=localSafetyRoute(input);
    if(safeRoute){state.lastResult=safeRoute;state.mode='result';render();return}
    try{
      const r=await api('concierge',{inputText:input,text:input,q:input});
      const d=dataOf(r);
      // 自由入力の返事が「理解＋次の質問」なら、ここで止めず質問画面へ進む。
      if(d.type==='understanding'){
        applyQuestionResponse(r);
        if(!state.currentTheme && d.matchedTheme)state.currentTheme=d.matchedTheme;
        const fallbackQuestion=localFallbackQuestion(state.currentTheme||findTheme(d.matchedTheme?.themeId));
        if(d.question){state.mode='question';render();return;}
        if(fallbackQuestion){state.currentQuestion=fallbackQuestion;state.stack=[fallbackQuestion.questionId];state.mode='question';render();return;}
      }
      // テーマを絞れない場合は、もう一度テーマを選べる画面へ戻す。
      if(d.type==='choose_theme'){
        state.mode='concierge';render();return;
      }
      state.lastResult=r;state.mode='result';render();
    }
    catch(e){state.lastResult={data:{matchedTheme:{name:'入力内容の相談'},reason:'入力内容を確認し、近い相談先を案内します。',contacts:state.contacts}};state.mode='result';render()}
  }

  document.addEventListener('click',async e=>{
    const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;
    if(action==='home'){state.mode='home';render();return}
    if(action==='retry'){loadHome();return}
    if(action==='concierge'){if(!state.themes.length)await loadThemes();state.mode='concierge';render();return}
    if(action==='themes'){if(!state.themes.length)await loadThemes();state.mode='themes';render();return}
    if(action==='board'){if(!state.articles.length)await loadBoard();state.mode='board';render();return}
    if(action==='free'){state.mode='free';render();return}
    if(action==='run-search'){runReverseSearch();return}
    if(action==='search-hint'){state.reverseQuery=text(el.dataset.query);state.reverseMatches=reverseLookup(state.reverseQuery);if(state.mode==='home')state.mode='concierge';render();return}
    if(action==='clear-search'){state.reverseQuery='';state.reverseMatches=[];render();return}
    if(action==='voice-input'){startVoiceInput(el.dataset.target);return}
    if(action==='theme'){const t=findTheme(el.dataset.theme);if(t)await startQuestion(t);return}
    if(action==='answer'){await answer(el.dataset.option);return}
    if(action==='question-back'){if(state.stack.length>1){state.stack.pop();render()}else{state.mode='concierge';render()}return}
    if(action==='send-free'){await sendFree();return}
    if(action==='image'){
      // 10番の瓦版だけは、既存の完成済み回覧板ページへ直接つなぐ。
      if(String(el.dataset.number)==='10'){
        location.href='kairanban.html';return;
      }
      state.mode='concierge';render();return;
    }
  });
  document.querySelectorAll('.bottom-nav button').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.nav)));
  begin();
})();
</script>
</body>
</html>
